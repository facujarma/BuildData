name: CD - VPS

# Se dispara cuando CI termina bien en master (no en PRs) o a mano desde
# Actions → CD - VPS → Run workflow.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   VPS_HOST         IP o host de la VM (ej: 34.138.144.130)
#   VPS_USER         usuario de SSH (el que corre docker en la VM)
#   VPS_SSH_KEY      clave privada ed25519 del deploy (con salto de línea final)
#   VPS_KNOWN_HOSTS  salida de `ssh-keyscan -H <VPS_HOST>`
#   VPS_PORT         opcional, default 22
#   API_HEALTH_URL   opcional, default https://api.builddata.com.ar/
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cd-vps
  # No cancelar un deploy a mitad de camino: el bot se reinicia y hay que
  # dejar que termine el healthcheck.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Update VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://api.builddata.com.ar
    # workflow_run también dispara si CI falla/cancela: solo seguir con éxito.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run apunta al commit exacto que corrió CI; en manual, al
          # branch desde el que se disparó.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Determine deploy-relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Deploy manual: se actualiza siempre."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No se pudo comparar con el commit anterior; se actualiza por las dudas."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet HEAD^ HEAD -- \
              apps/Backend apps/WhatsApp-Bot deploy docker-compose.yml \
              package.json bun.lock .github/workflows/deploy.yml; then
            echo "Sin cambios en Backend/Bot/deploy: se omite la actualización."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Hay cambios en Backend/Bot/deploy: se actualiza."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy secrets
        if: steps.changes.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name. Configuralo en Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup SSH
        if: steps.changes.outputs.deploy == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        if: steps.changes.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          # El checkout de la VM es un clon normal de master: update.sh hace
          # git pull --ff-only, rebuild de las imágenes y up -d.
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail; cd "$HOME/BuildData"; git checkout master; ./deploy/update.sh'

      - name: Health check
        if: steps.changes.outputs.deploy == 'true'
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          URL="${API_HEALTH_URL:-https://api.builddata.com.ar/}"
          echo "Esperando $URL"
          for intento in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL" | grep -q "BuildData API funcionando"; then
              echo "API OK tras $intento intento(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::La API no respondió correctamente después del deploy"
          exit 1
