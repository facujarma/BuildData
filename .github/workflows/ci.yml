name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot:
    name: WhatsApp Bot (tests + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test:bot
      - name: Typecheck
        run: bun run typecheck:bot

  backend:
    name: Backend (tests + syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Service tests
        run: bun run test:backend
      - name: Syntax check
        run: bun run check:backend

  frontend:
    # OJO: `name` es el `context` que exige la branch protection de master
    # ("Frontend (lint + typecheck)"). Si se renombra, hay que actualizar los
    # required status checks en el mismo paso o los PRs quedan bloqueados.
    name: Frontend (lint + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck:frontend
      - name: Unit tests
        run: bun run test:frontend
